<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <title>Conectando... &gt; redirect</title>
    <meta http-equiv="refresh" content="4; url=$(link-redirect)">
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <meta http-equiv="pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="expires" content="-1">

    <style>
        /* Loader Animation */
        .loader {
            margin: 60px auto;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border: 1.1em solid rgba(145, 145, 146, 0.2);
            border-left-color: #919192;
            border-radius: 50%;
            width: 10em;
            height: 10em;
            -webkit-transform: translateZ(0);
            -ms-transform: translateZ(0);
            transform: translateZ(0);
            animation: load8 1.1s infinite linear;
        }

        @keyframes load8 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Styling for body and text */
        body {
            color: #737373;
            font-size: 12px;
            font-family: Verdana, sans-serif;
            width: 100%;
            background-color: white;
        }

        textarea, input, select {
            background-color: #FDFBFB;
            border: 1px solid #BBBBBB;
            padding: 2px;
            margin: 1px;
            font-size: 14px;
            color: #808080;
        }

        a, a:link, a:visited, a:active {
            color: #AAAAAA;
            text-decoration: none;
            font-size: 12px;
        }

        a:hover {
            border-bottom: 1px dotted #c1c1c1;
            color: #AAAAAA;
        }

        img { border: none; }
        td { font-size: 12px; color: #7A7A7A; }
    </style>

    <script>
        function startClock() {
            $(if popup == 'true') open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290'); $(endif)
            setTimeout(() => {
                location.href = 'youtube.com';
            }, 500);
        }
    </script>
</head>

<body onload="startClock()">
    <table style="width: 100%; height: 100%; margin: 0; background-color: transparent;">
        <tr>
            <td style="vertical-align: middle; text-align: center; height: 100%;">
                <div class="loader">Loading...</div>
            </td>
        </tr>
    </table>
</body>
</html>
