<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BARAKAT NET</title>
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />	
<meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;" />
<link rel="stylesheet" href="login.css" media="screen">
 

</head>
<body class='login' bgcolor="#e5f0ff">
$(if chap-id)
	<form name="sendin" action="$(link-login-only)" method="post">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />
	</form>
	
	<script type="text/javascript" src="/md5.js"></script>
	<script type="text/javascript">
	<!--
	    function doLogin() {
		document.sendin.username.value = document.login.username.value;
		document.sendin.password.value = hexMD5('$(chap-id)' + document.login.username.value + '$(chap-challenge)');
		document.sendin.submit();
		return false;
	    }
	//-->
	</script>
$(endif)


<form class="vertical-form" name="login" action="$(link-login-only)" method="post"
	$(if chap-id) onSubmit="return doLogin()" $(endif)>
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
<div style="margin:0;padding:0;display:inline"></div>
<legend style="
    margin-bottom: 0px;
">

<!-- <h2 style="
    margin-top: 0px;
    margin-bottom: 0px;
">Selamat Datang di</h2> -->
<img class="logo" src="11.png" width="320px" />
</legend>
<!-- <p style="text-align: center; color: black;" >Masukkan Vouchers Anda</p> -->
<input name="username" type="text" value="$(username)" placeholder="Password" size="30" />
<input autocomplete="off" name="password" type="hidden" label="false" placeholder="Password" size="0" />
<input style="background-color: #3969b5" name="submit" type="submit" value="Login" />
<div class='footer'>
<p>$(if trial == 'yes')Free trial available, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">click here</a>.$(endif)</p>
<p>$(if error)<span style="color: #FF8080; font-size: 16px">$(error)</span>$(endif)</p>
<br>
<p>
</p>
</div>
</form>

<script type="text/javascript">
<!--
  document.login.username.focus();
//-->
</script>
</body>
</html>
